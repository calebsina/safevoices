openapi: 3.0.3
info:
  title: 'SafeVoice API'
  description: 'Confidential Abuse & GBV Reporting Platform — REST API. Reporters are anonymous (case code + PIN); staff authenticate with JWT.'
  version: 1.0.0
servers:
  -
    url: 'http://localhost'
tags:
  -
    name: 'Public / Report intake'
    description: "\nGuided, anonymous report intake. Mirrors the Amie conversation:\nstart -> consent -> context -> incident -> submit. Both the WhatsApp\nwebhook adapter and the web portal call these same endpoints.\n\nAfter `start`, every step requires the `X-Draft-Token` header\nreturned by `start` (drafts expire after 24h). No account, no login."
  -
    name: 'Public / Anonymous follow-up'
    description: "\nPer-case authentication for reporters: every request carries\n`X-Case-Code` + `X-Case-Pin` headers (issued at submission).\nAttempts are throttled and logged; wrong code and wrong PIN return\nan identical error on purpose."
  -
    name: 'Staff / Authentication'
    description: "\nStaff authentication (caseworkers, supervisors, administrators) via\nemail + password (+ optional TOTP) returning a JWT bearer token.\nReporters never authenticate here - see the Follow-up group."
  -
    name: 'Staff / Cases'
    description: "\nStaff-side case operations. Row-level visibility follows the role\nmatrix: caseworkers see assigned cases, supervisors their unit,\nadministrators everything - enforced by ReportPolicy + query scope."
  -
    name: 'Staff / Evidence'
    description: "\nEvidence vault access for staff. Every list view and every download\nwrites an audit entry - there is no unaudited path to evidence."
  -
    name: 'Staff / Case messages'
    description: "\nStaff side of the anonymous two-way channel. Staff address the case,\nnever a person; delivery is routed through the tokenised identity."
  -
    name: 'Staff / Case actions'
    description: ''
  -
    name: 'Staff / Referrals'
    description: ''
  -
    name: 'Reference data'
    description: "\nCase categories. Public read (the intake UI needs them); admin write\nbehind permission `reference.manage`."
  -
    name: Localization
    description: "\nPublic listing of active locales; admin CRUD for enabling a new\nlanguage (adding a row is all it takes - no migration)."
  -
    name: CMS
    description: "\nDynamic pages. Public resolution by slug (or localized slug) serves\nthe landing page / portal; admin CRUD behind permission `cms.manage`."
  -
    name: Consent
    description: ''
  -
    name: 'Admin / Users'
    description: "\nStaff account management. Requires permission `users.manage`.\nAccounts are deactivated, never hard-deleted (audit integrity)."
  -
    name: 'Admin / Roles & permissions'
    description: "\nRequires permission `roles.manage`. System roles (caseworker,\nsupervisor, administrator) cannot be deleted."
  -
    name: 'Admin / Offices'
    description: ''
  -
    name: 'Admin / Settings'
    description: ''
  -
    name: 'Admin / Notification templates'
    description: "\nReporter-facing template bodies must stay discreet: reference code\nand status wording only, never case content."
  -
    name: 'Admin / Audit trail'
    description: "\nRead-only. Requires permission `audit.view`. The trail is append-only\nat the application layer - there is no update or delete endpoint."
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'Obtain a token from <code>POST /api/v1/auth/login</code>. Reporter (public) endpoints use X-Case-Code / X-Case-Pin headers instead.'
security:
  -
    default: []
paths:
  /api/v1/intake/start:
    post:
      summary: 'Start a report (draft)'
      operationId: startAReportdraft
      description: ''
      parameters: []
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: Created
                  data:
                    report_id: 9d3c...
                    draft_token: a1B2...
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Created
                  data:
                    type: object
                    properties:
                      report_id:
                        type: string
                        example: 9d3c...
                      draft_token:
                        type: string
                        example: a1B2...
      tags:
        - 'Public / Report intake'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                channel:
                  type: string
                  description: 'Channel key: whatsapp, web, sms, ussd.'
                  example: web
                locale:
                  type: string
                  description: 'Locale code (en, fr).'
                  example: fr
                phone:
                  type: string
                  description: 'E.164 phone; omit if the reporter declines contact.'
                  example: '+237650000000'
                  nullable: true
              required:
                - channel
                - locale
      security: []
  '/api/v1/intake/{report}/consent':
    patch:
      summary: 'Step: consent'
      operationId: stepConsent
      description: ''
      parameters:
        -
          in: header
          name: X-Draft-Token
          description: ''
          example: a1B2c3...
          schema:
            type: string
      responses:
        500:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Server Error'
                properties:
                  message:
                    type: string
                    example: 'Server Error'
      tags:
        - 'Public / Report intake'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                data_use_consent:
                  type: boolean
                  description: 'Must be true to proceed.'
                  example: true
                contact_consent:
                  type: boolean
                  description: 'May be false (no notifications).'
                  example: true
              required:
                - data_use_consent
                - contact_consent
      security: []
    parameters:
      -
        in: path
        name: report
        description: ''
        example: consequatur
        required: true
        schema:
          type: string
  '/api/v1/intake/{report}/context':
    patch:
      summary: 'Step: case context'
      operationId: stepCaseContext
      description: ''
      parameters:
        -
          in: header
          name: X-Draft-Token
          description: ''
          example: a1B2c3...
          schema:
            type: string
      responses:
        500:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Server Error'
                properties:
                  message:
                    type: string
                    example: 'Server Error'
      tags:
        - 'Public / Report intake'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                affected_person_type_id:
                  type: integer
                  description: 'Must match an existing stored value.'
                  example: 17
                relationship_id:
                  type: integer
                  description: 'Must match an existing stored value.'
                  example: 17
                reporting_for:
                  type: string
                  description: ''
                  example: self
                  enum:
                    - self
                    - other
              required:
                - affected_person_type_id
                - relationship_id
                - reporting_for
      security: []
    parameters:
      -
        in: path
        name: report
        description: ''
        example: consequatur
        required: true
        schema:
          type: string
  '/api/v1/intake/{report}/incident':
    patch:
      summary: 'Step: incident description'
      operationId: stepIncidentDescription
      description: ''
      parameters:
        -
          in: header
          name: X-Draft-Token
          description: ''
          example: a1B2c3...
          schema:
            type: string
      responses:
        500:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Server Error'
                properties:
                  message:
                    type: string
                    example: 'Server Error'
      tags:
        - 'Public / Report intake'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                category_id:
                  type: integer
                  description: 'Case category.'
                  example: 1
                description:
                  type: string
                  description: "The reporter's own words."
                  example: ...
                incident_area:
                  type: string
                  description: 'Approximate area only - no exact address required.'
                  example: 'Yaoundé IV'
                  nullable: true
                incident_at:
                  type: string
                  description: 'ISO datetime.'
                  example: '2026-06-30T18:00:00Z'
                  nullable: true
                is_imminent_danger:
                  type: boolean
                  description: 'Flags the report urgent.'
                  example: false
              required:
                - category_id
                - description
      security: []
    parameters:
      -
        in: path
        name: report
        description: ''
        example: consequatur
        required: true
        schema:
          type: string
  '/api/v1/intake/{report}/submit':
    post:
      summary: 'Submit the report'
      operationId: submitTheReport
      description: "Returns the case reference code and the PIN **exactly once**.\nThere is no recovery path (anonymity trade-off): the client must\ninstruct the reporter to save both."
      parameters:
        -
          in: header
          name: X-Draft-Token
          description: ''
          example: a1B2c3...
          schema:
            type: string
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  data:
                    reference_code: SV-7F3K-9Q2
                    pin: '482913'
                    expected_response: 'in 2 hours'
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      reference_code:
                        type: string
                        example: SV-7F3K-9Q2
                      pin:
                        type: string
                        example: '482913'
                      expected_response:
                        type: string
                        example: 'in 2 hours'
      tags:
        - 'Public / Report intake'
      security: []
    parameters:
      -
        in: path
        name: report
        description: ''
        example: consequatur
        required: true
        schema:
          type: string
  '/api/v1/intake/{report}/evidence':
    post:
      summary: 'Attach evidence after submission'
      operationId: attachEvidenceAfterSubmission
      description: ''
      parameters:
        -
          in: header
          name: X-Case-Code
          description: ''
          example: SV-7F3K-9Q2
          schema:
            type: string
        -
          in: header
          name: X-Case-Pin
          description: ''
          example: '482913'
          schema:
            type: string
      responses:
        500:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Server Error'
                properties:
                  message:
                    type: string
                    example: 'Server Error'
      tags:
        - 'Public / Anonymous follow-up'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: 'The evidence file (image/video/audio/document).'
              required:
                - file
      security: []
    parameters:
      -
        in: path
        name: report
        description: ''
        example: consequatur
        required: true
        schema:
          type: string
  /api/v1/follow-up/status:
    get:
      summary: 'Case status (reporter view)'
      operationId: caseStatusreporterView
      description: ''
      parameters:
        -
          in: header
          name: X-Case-Code
          description: ''
          example: SV-7F3K-9Q2
          schema:
            type: string
        -
          in: header
          name: X-Case-Pin
          description: ''
          example: '482913'
          schema:
            type: string
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  data:
                    reference_code: SV-7F3K-9Q2
                    status: 'Being reviewed'
                    unread_messages: 1
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      reference_code:
                        type: string
                        example: SV-7F3K-9Q2
                      status:
                        type: string
                        example: 'Being reviewed'
                      unread_messages:
                        type: integer
                        example: 1
      tags:
        - 'Public / Anonymous follow-up'
      security: []
  /api/v1/follow-up/information:
    post:
      summary: 'Add information'
      operationId: addInformation
      description: ''
      parameters:
        -
          in: header
          name: X-Case-Code
          description: ''
          example: SV-7F3K-9Q2
          schema:
            type: string
        -
          in: header
          name: X-Case-Pin
          description: ''
          example: '482913'
          schema:
            type: string
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'The case code or PIN is incorrect.'
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'The case code or PIN is incorrect.'
      tags:
        - 'Public / Anonymous follow-up'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                body:
                  type: string
                  description: 'Must not be greater than 10000 characters.'
                  example: vmqeopfuudtdsufvyvddq
              required:
                - body
      security: []
  /api/v1/follow-up/messages:
    get:
      summary: 'Message thread'
      operationId: messageThread
      description: 'Staff names are stripped: the reporter only sees sender_type.'
      parameters:
        -
          in: header
          name: X-Case-Code
          description: ''
          example: SV-7F3K-9Q2
          schema:
            type: string
        -
          in: header
          name: X-Case-Pin
          description: ''
          example: '482913'
          schema:
            type: string
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'The case code or PIN is incorrect.'
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'The case code or PIN is incorrect.'
      tags:
        - 'Public / Anonymous follow-up'
      security: []
    post:
      summary: 'Reply in the thread'
      operationId: replyInTheThread
      description: ''
      parameters:
        -
          in: header
          name: X-Case-Code
          description: ''
          example: SV-7F3K-9Q2
          schema:
            type: string
        -
          in: header
          name: X-Case-Pin
          description: ''
          example: '482913'
          schema:
            type: string
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'The case code or PIN is incorrect.'
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'The case code or PIN is incorrect.'
      tags:
        - 'Public / Anonymous follow-up'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                body:
                  type: string
                  description: 'Must not be greater than 5000 characters.'
                  example: vmqeopfuudtdsufvyvddq
              required:
                - body
      security: []
  /api/v1/follow-up/evidence:
    post:
      summary: 'Attach evidence after submission'
      operationId: attachEvidenceAfterSubmission
      description: ''
      parameters:
        -
          in: header
          name: X-Case-Code
          description: ''
          example: SV-7F3K-9Q2
          schema:
            type: string
        -
          in: header
          name: X-Case-Pin
          description: ''
          example: '482913'
          schema:
            type: string
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'The case code or PIN is incorrect.'
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'The case code or PIN is incorrect.'
      tags:
        - 'Public / Anonymous follow-up'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: 'The evidence file (image/video/audio/document).'
              required:
                - file
      security: []
  /api/v1/auth/login:
    post:
      summary: Login
      operationId: login
      description: ''
      parameters: []
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: OK
                  data:
                    access_token: eyJ...
                    token_type: bearer
                    expires_in: 3600
                    user:
                      id: ...
                      name: Admin
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: OK
                  data:
                    type: object
                    properties:
                      access_token:
                        type: string
                        example: eyJ...
                      token_type:
                        type: string
                        example: bearer
                      expires_in:
                        type: integer
                        example: 3600
                      user:
                        type: object
                        properties:
                          id:
                            type: string
                            example: ...
                          name:
                            type: string
                            example: Admin
      tags:
        - 'Staff / Authentication'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Staff email.'
                  example: admin@safevoice.cm
                password:
                  type: string
                  description: Password.
                  example: ChangeMe-Please-1!
                otp:
                  type: string
                  description: '6-digit TOTP code, required when MFA is enabled.'
                  example: '123456'
                  nullable: true
              required:
                - email
                - password
      security: []
  /api/v1/auth/refresh:
    post:
      summary: 'Refresh token'
      operationId: refreshToken
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: Unauthenticated.
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - 'Staff / Authentication'
  /api/v1/auth/me:
    get:
      summary: 'Current user'
      operationId: currentUser
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: Unauthenticated.
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - 'Staff / Authentication'
  /api/v1/auth/logout:
    post:
      summary: 'Logout (invalidate token)'
      operationId: logoutinvalidateToken
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: Unauthenticated.
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - 'Staff / Authentication'
  /api/v1/reports:
    get:
      summary: 'Case queue'
      operationId: caseQueue
      description: ''
      parameters:
        -
          in: query
          name: status_id
          description: 'Filter by status.'
          example: 1
          required: false
          schema:
            type: integer
            description: 'Filter by status.'
            example: 1
        -
          in: query
          name: priority_level_id
          description: 'Filter by priority.'
          example: 1
          required: false
          schema:
            type: integer
            description: 'Filter by priority.'
            example: 1
        -
          in: query
          name: category_id
          description: 'Filter by category.'
          example: 2
          required: false
          schema:
            type: integer
            description: 'Filter by category.'
            example: 2
        -
          in: query
          name: is_urgent
          description: 'Urgent only.'
          example: true
          required: false
          schema:
            type: boolean
            description: 'Urgent only.'
            example: true
        -
          in: query
          name: unassigned
          description: 'Unassigned only (triage view).'
          example: true
          required: false
          schema:
            type: boolean
            description: 'Unassigned only (triage view).'
            example: true
        -
          in: query
          name: search
          description: 'Reference code search.'
          example: SV-7F
          required: false
          schema:
            type: string
            description: 'Reference code search.'
            example: SV-7F
        -
          in: query
          name: per_page
          description: 'Page size (max 100).'
          example: 15
          required: false
          schema:
            type: integer
            description: 'Page size (max 100).'
            example: 15
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: Unauthenticated.
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - 'Staff / Cases'
  '/api/v1/reports/{report_id}':
    get:
      summary: 'Case detail'
      operationId: caseDetail
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: Unauthenticated.
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - 'Staff / Cases'
    parameters:
      -
        in: path
        name: report_id
        description: 'The ID of the report.'
        example: consequatur
        required: true
        schema:
          type: string
  '/api/v1/reports/{report_id}/status':
    patch:
      summary: 'Update status'
      operationId: updateStatus
      description: "Writes immutable case_status_history and (with consent) sends the\nreporter a discreet status notification."
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: Unauthenticated.
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - 'Staff / Cases'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status_id:
                  type: integer
                  description: 'Must match an existing stored value.'
                  example: 17
                note:
                  type: string
                  description: 'Must not be greater than 500 characters.'
                  example: mqeopfuudtdsufvyvddqa
                  nullable: true
              required:
                - status_id
    parameters:
      -
        in: path
        name: report_id
        description: 'The ID of the report.'
        example: consequatur
        required: true
        schema:
          type: string
  '/api/v1/reports/{report_id}/assign':
    patch:
      summary: 'Assign case'
      operationId: assignCase
      description: 'Supervisor/administrator action (permission: case.assign).'
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: Unauthenticated.
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - 'Staff / Cases'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                assigned_to:
                  type: string
                  description: 'Must be a valid UUID. Must match an existing stored value.'
                  example: 66529e01-d113-3473-8d6f-9e11e09332ea
                office_id:
                  type: integer
                  description: 'Must match an existing stored value.'
                  example: 17
                  nullable: true
              required:
                - assigned_to
    parameters:
      -
        in: path
        name: report_id
        description: 'The ID of the report.'
        example: consequatur
        required: true
        schema:
          type: string
  '/api/v1/reports/{report_id}/escalate':
    post:
      summary: 'Escalate as urgent'
      operationId: escalateAsUrgent
      description: 'Flags the case urgent and alerts unit supervisors.'
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
